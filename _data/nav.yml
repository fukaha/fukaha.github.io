# Site sections in menu order. `url` is the address of the page in each language;
# `image` is the id of its picture in _data/images.yml. An item with a `parent` is shown under that
# item in the menu, not on its own; a `hidden` item is not in the menu at all. `all` names the label
# (under home in _data/i18n.yml) of a first menu line that leads to the parent's own page.
