  theses: 0
  works: 5
- id: kadilkudat-semseddin-muhammed-b-abdullah-ed-deyri-el-makdisi
  name:
    tr: Kadılkudat Şemseddin Muhammed b. Abdullah ed-Deyri el-Makdisi
    en: Chief Judge Shams al-Din Muhammad b. 'Abd Allah al-Dayri al-Maqdisi
    ar: شمس الدين الديري
  madhhab: hanefi
  death: 827
  deathM: 1423-24
  place:
    tr: Kudüs
    en: Jerusalem
    ar: القدس
  summary:
    tr: Hadis dışındaki bütün fenlerde çalıştığını söylerdi; Kahire Hanefî kadılığı ve Müeyyediyye meşihatı yaptı. Kudüs'e gidip orada vefat etti.
    en: He said he had studied every science except hadith; Hanafi judge of Cairo and head of the Mu'ayyadiyya, he died in Jerusalem.
  theses: 2
  works: 0
- id: molla-husrev-muhammed-b-feramurz
  name:
    tr: Molla Hüsrev Muhammed b. Feramurz
    en: Mulla Khusraw Muhammad b. Faramurz
    ar: المولى خسرو
  madhhab: hanefi
  death: 885
  deathM: 1480-81
  place:
    tr: İstanbul
    en: Istanbul
    ar: القسطنطينية
  summary:
    tr: Teftâzânî'nin talebesi Heravi'den okudu; II. Murad döneminde müderris, Fatih döneminde kazasker ve Hızır Bey'den sonra İstanbul kadısı oldu. Dürerü'l-hükkâm Osmanlı fıkhının temel metinlerindendir.
    en: A student of al-Taftazani's pupil Haydar al-Harawi, he taught under Murad II and became military judge and then judge of Constantinople under Mehmed II; his Durar al-hukkam is a core Ottoman legal text.
  theses: 0
  works: 6
- id: cemaleddin-muhammed-b-muhammed-el-aksarayi
  name:
    tr: Cemaleddin Muhammed b. Muhammed el-Aksarayi
    en: Jamal al-Din Muhammad b. Muhammad al-Aqsara'i
    ar: جمال الدين الأقسرائي
  madhhab: hanefi
  death: 775
  deathM: 1373-74
  place: null
  summary:
    tr: Karaman'daki, ancak Sıhâh'ı ezbere bilenin ders verebileceği Müselsele Medresesi'nin müderrisi. Leknevi, Fahreddin er-Razi'ye uzanan nesebini ve Musannifek meselesini tartışır.
    en: Professor at the Musalsala madrasa in Karaman, whose founder required its teacher to know al-Jawhari's Sihah by heart; al-Laknawi discusses his claimed descent from Fakhr al-Din al-Razi.
  theses: 2
  works: 3
- id: imamul-huda-ebu-mansur-muhammed-b-muhammed-el-maturidi
  name:
    tr: İmamü'l-Hüda Ebu Mansur Muhammed b. Muhammed el-Maturidi
    en: Imam al-Huda Abu Mansur Muhammad b. Muhammad al-Maturidi
    ar: أبو منصور الماتريدي
  madhhab: hanefi
  death: 333
  deathM: 944-45
  place: null
  summary:
    tr: Kelamcıların imamı ve Müslümanların akidesini tashih eden âlim; Semerkant'ın Maturid mahallesinden. Kitâbü't-Tevhîd başta olmak üzere batıl fırkalara reddiyeler yazdı.
    en: The imam of theologians who set Sunni belief in order, from the Maturid quarter of Samarqand; author of Kitab al-Tawhid and refutations of sectarian doctrines.
  theses: 0
  works: 6
- id: ekmeleddin-muhammed-b-muhammed-el-baberti
  name:
    tr: Ekmeleddin Muhammed b. Muhammed el-Bâbertî
    en: Akmal al-Din Muhammad b. Muhammad al-Babarti
    ar: أكمل الدين البابرتي
  madhhab: hanefi
  death: 786
  deathM: 1384-85
  place:
    tr: Kahire
    en: Cairo
    ar: القاهرة
  summary:
    tr: Halep'te, sonra Kahire'de okudu; Şeyhuniyye'nin ilk şeyhi oldu ve kadılığı defalarca reddetti. Hidâye şerhi el-İnâye muteberdir; Seyyid Şerif ve Molla Fenari onun talebesidir.
    en: He studied in Aleppo and Cairo, became the first head of the Shaykhuniyya and repeatedly refused judgeships; his al-'Inaya on al-Hidaya is authoritative, and al-Sayyid al-Sharif and Mulla Fanari were his students.
  theses: 6
  works: 7
- id: semseddin-muhammed-b-yusuf-el-konevi
  name:
    tr: Şemseddin Muhammed b. Yusuf el-Konevi
    en: Shams al-Din Muhammad b. Yusuf al-Qunawi
    ar: شمس الدين القونوي صاحب درر البحار
  madhhab: hanefi
  death: 788
  deathM: 1386-87
  place: null
  summary:
    tr: İlim ve amelde vaktinin imamı, zahidlerin önderi. Mecmau'l-bahreyn'e Hanbelî mezhebini ekleyerek Dürerü'l-bihâr'ı yazdı.
    en: The imam of his time in learning and practice; in Durar al-bihar he expanded Majma' al-bahrayn to include the Hanbali school.
  theses: 0
  works: 5
- id: hatibzade-muhyiddin-muhammed
  name:
    tr: Hatibzade Muhyiddin Muhammed
    en: Khatibzade Muhyi al-Din Muhammad
    ar: خطيب زاده محيي الدين محمد
  madhhab: hanefi
  death: 901
  deathM: 1495-96
  place: null
  summary:
    tr: Babası, Tusi ve Hızır Bey'den okudu; İstanbul'da müderris oldu. Keskin dili ve münazaradaki cesaretiyle tanınırdı; İbn Kemal onun talebesidir.
    en: A student of his father, al-Tusi and Khidr Beg who taught in Constantinople, known for a sharp tongue in debate; Ibn Kamal was his student.
  theses: 0
  works: 5
- id: cemaleddin-ebus-sena-mahmud-b-ahmed-el-konevi
  name:
    tr: Cemaleddin Ebu's-Sena Mahmud b. Ahmed el-Konevi
    en: Jamal al-Din Abu al-Thana' Mahmud b. Ahmad al-Qunawi
    ar: محمود بن أحمد القونوي
  madhhab: hanefi
  death: 777
  deathM: 1375-76
  place:
    tr: Dımaşk
    en: Damascus
    ar: دمشق
  summary:
    tr: Babasından okudu; Dımaşk kadılığı yaptı. Rükûda elleri kaldırmanın namazı bozmadığını ispat eden risalesi Leknevi'nin övgüsüne mazhardır.
    en: A student of his father and judge of Damascus; al-Laknawi praises his treatise proving that raising the hands does not invalidate the prayer.
  theses: 0
  works: 7
- id: kadilkudat-bedreddin-mahmud-b-ahmed-el-ayni
  name:
    tr: Kadılkudat Bedreddin Mahmud b. Ahmed el-Ayni
    en: Chief Judge Badr al-Din Mahmud b. Ahmad al-'Ayni
    ar: بدر الدين العيني
  madhhab: hanefi
  death: 855
  deathM: 1451-52
  place:
    tr: Kahire
    en: Cairo
    ar: القاهرة
  summary:
    tr: Babası Ayıntab kadısıydı; 787'de Kahire'ye gelip muhtesiplik ve Hanefî kadılkudatlığı yaptı. Buhari şerhi Umdetü'l-kârî ile Hidâye şerhi el-Binâye başlıca eserleridir.
    en: Son of a judge of 'Ayntab, he came to Cairo in 787 and served as market inspector and Hanafi chief judge; his main works are 'Umdat al-qari on al-Bukhari and al-Binaya on al-Hidaya.
  theses: 0
  works: 7
- id: carullah-ebul-kasim-mahmud-b-omer-ez-zemahseri
  name:
    tr: Carullah Ebu'l-Kasım Mahmud b. Ömer ez-Zemahşeri
    en: Jar Allah Abu al-Qasim Mahmud b. 'Umar al-Zamakhshari
    ar: جار الله الزمخشري
  madhhab: hanefi
  death: 538
  deathM: 1143-44
  place:
    tr: Harezm (Cürcaniyye)
    en: Khwarazm (Gurganj)
    ar: خوارزم
  summary:
    tr: Harezm'in Zemahşer köyünden; fürûda Hanefî, itikatta Mutezili. Mekke'de mücavir kaldığı için 'Cârullah' diye anıldı; Keşşâf tefsiri ve el-Mufassal nahvi en tanınan eserleridir.
    en: From Zamakhshar in Khwarazm, Hanafi in law and Mu'tazili in creed; called Jar Allah for his stay in Mecca, he is best known for the Kashshaf and al-Mufassal.
  theses: 7
  works: 8
- id: necmeddin-ebur-reca-muhtar-b-mahmud-ez-zahidi
  name:
    tr: Necmeddin Ebu'r-Reca Muhtar b. Mahmud ez-Zahidi
    en: Najm al-Din Abu al-Raja' Mukhtar b. Mahmud al-Zahidi
    ar: مختار بن محمود الزاهدي
  madhhab: hanefi
  death: 658
  deathM: 1259-60
  place: null
  summary:
    tr: Harezm'in Gazmin kasabasından; Mutarrizi ve Sekkaki gibi büyüklerden okudu, Bağdat'ta münazaralar yaptı ve bir süre Anadolu'da kaldı. Leknevi, fürûda Hanefî itikatta Mutezili olduğunu ve eserlerinin başka kaynaklarla teyit edilmeden kullanılmaması gerektiğini belirtir.
    en: From Ghazmin in Khwarazm, a student of al-Mutarrizi and al-Sakkaki who debated in Baghdad and lived for a time in Anatolia; al-Laknawi warns that as a Mu'tazili his works need corroboration.
  theses: 3
  works: 7
- id: burhaneddin-ebul-muvaffak-mesud-b-suca-el-emevi
  name:
    tr: Burhaneddin Ebu'l-Muvaffak Mesud b. Şuca' el-Emevi
    en: Burhan al-Din Abu al-Muwaffaq Mas'ud b. Shuja' al-Umawi
    ar: مسعود بن شجاع الأموي
  madhhab: hanefi
  death: 599
  deathM: 1202-03
  place: null
  summary:
    tr: Dımaşk'ta doğdu, Burhan el-Belhi'den okudu; ordu kadılığı yaptı ve Nuriyye'de ders verdi, mezhepte önder sayıldı.
    en: Born in Damascus and taught by al-Burhan al-Balkhi; he was military judge, taught at the Nuriyya and led the school.
  theses: 4
  works: 0
- id: hocazade-muslihuddin-mustafa-b-yusuf-el-bursevi
  name:
    tr: Hocazade Muslihuddin Mustafa b. Yusuf el-Bursevi
    en: Khwajazade Muslih al-Din Mustafa b. Yusuf al-Burusawi
    ar: خواجه زاده مصطفى بن يوسف
  madhhab: hanefi
  death: 893
  deathM: 1487-88
  place:
    tr: Bursa
    en: Bursa
    ar: بروسة
  summary:
    tr: Hızır Bey'in talebesi; Fatih'in hocası ve İstanbul kadısı oldu. Fatih'in emriyle yazdığı Tehâfüt, Devvani ve Ali Kuşçu gibi âlimlerce övüldü.
    en: A student of Khidr Beg, tutor to Mehmed II and judge of Constantinople; his Tahafut, written at Mehmed's request, was praised by al-Dawani and 'Ali Qushji.
  theses: 4
  works: 4
- id: kadilkudat-cemaleddin-ebu-sad-el-mutahhar-b-el-huseyin-el-yezdi
  name:
    tr: Kadılkudat Cemaleddin Ebu Sa'd el-Mutahhar b. el-Hüseyin el-Yezdi
    en: Chief Judge Jamal al-Din Abu Sa'd al-Mutahhar b. al-Husayn al-Yazdi
    ar: المطهر بن الحسين اليزدي
  madhhab: hanefi
  death: 591
  deathM: 1194-95
  place:
    tr: Kus
    en: Qus
    ar: قوص
  summary:
    tr: Za'ferani tertibindeki el-Câmiu's-sağîr'e iki ciltlik et-Tehzîb şerhini yazdı. Suyuti'ye göre memleketinde bin iki yüz talebeli on iki medrese onun idaresindeydi; Kus'ta vefat etti.
    en: Author of al-Tahdhib, a two-volume commentary on al-Jami' al-saghir; al-Suyuti says he ran twelve madrasas with 1,200 students at home, and he died at Qus in Egypt.
  theses: 0
  works: 5
- id: ebul-feth-nasir-b-abdusseyyid-el-mutarrizi
  name:
    tr: Ebu'l-Feth Nasır b. Abdüsseyyid el-Mutarrizi
    en: Abu al-Fath Nasir b. 'Abd al-Sayyid al-Mutarrizi
    ar: ناصر بن عبد السيد المطرزي
  madhhab: hanefi
  death: 610
  deathM: 1213-14
  place:
    tr: Harezm (Cürcaniyye)
    en: Khwarazm (Gurganj)
    ar: خوارزم
  summary:
    tr: Zemahşeri'nin vefat ettiği yıl doğduğu için 'halefi' diye anıldı; fıkıh, Arapça ve lügatte imamdı. Fıkıh terimlerinin sözlüğü el-Muğrib onundur.
    en: Born the year al-Zamakhshari died and so called his successor; a master of law, Arabic and lexicography, author of al-Mughrib, a dictionary of legal terms.
  theses: 0
  works: 6
- id: fakih-ebul-leys-nasr-b-muhammed-es-semerkandi
  name:
    tr: Fakih Ebu'l-Leys Nasr b. Muhammed es-Semerkandi
    en: Abu al-Layth al-Faqih Nasr b. Muhammad al-Samarqandi
    ar: أبو الليث السمرقندي
  madhhab: hanefi
  death: 373
  deathM: 983-84
  place: null
  summary:
    tr: '''İmamü''l-hüdâ'' diye anılır; Hinduvani''den okudu. Tefsiri, Nevâzil''i, Tenbîhü''l-gâfilîn ve Bostânü''l-ârifîn''i yaygındır; vefat tarihinde farklı rivayetler vardır.'
    en: Called 'Imam al-Huda', a student of al-Hinduwani; his Qur'an commentary, al-Nawazil, Tanbih al-ghafilin and Bustan al-'arifin were widely read. Sources differ on his death date.
  theses: 0
  works: 8
- id: ahi-celebi-yusuf-b-cuneyd-et-tokadi
  name:
    tr: Ahi Çelebi Yusuf b. Cüneyd et-Tokadi
    en: Akhi Chalabi Yusuf b. Junayd al-Tuqati
    ar: أخي جلبي يوسف بن جنيد
  madhhab: hanefi
  death: 905
  deathM: 1499-1500
  place: null
  summary:
    tr: Molla Hüsrev'in talebesi; Kalenderhane'de ve Sahn-ı Seman'da müderris. Yaygın Vikâye haşiyesi Zahîretü'l-ukbâ'yı 891-901 yıllarında yazdı; Leknevi bunun Hasan Çelebi'ye ait olmadığını ispatlar.
    en: A student of Mulla Khusraw who taught at the Qalandariyya and the eight madrasas; he wrote the widely used gloss Dhakhirat al-'uqba (891-901), which al-Laknawi shows is not by Hasan Chalabi.
  theses: 2
  works: 2
- id: sibt-ibnul-cevzi-semseddin-yusuf-b-kizoglu
  name:
    tr: Sıbt İbnü'l-Cevzi Şemseddin Yusuf b. Kızoğlu
    en: Sibt Ibn al-Jawzi Shams al-Din Yusuf b. Qizoghlu
    ar: سبط ابن الجوزي
  madhhab: hanefi
  death: 654
  deathM: 1256-57
  place: null
  summary:
    tr: İbnü'l-Cevzi'nin kız torunu; Hanbelî yetişti, Dımaşk'ta Hasiri'den okuyup el-Melikü'l-Muazzam'ın etkisiyle Hanefî oldu. Kalpleri yumuşatan vaazları ve Mir'âtü'z-zamân tarihiyle meşhurdur.
    en: Grandson of Ibn al-Jawzi, raised Hanbali, he turned Hanafi in Damascus under al-Mu'azzam and al-Hasiri; famed for his moving sermons and the chronicle Mir'at al-zaman.
  theses: 0
  works: 6
