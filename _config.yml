title: Fukahâ
url: https://fukaha.github.io
baseurl: ""
timezone: Europe/Istanbul

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor

# Posts: _posts/<lang>/<kind>/YYYY-MM-DD-slug.md
# The folder gives the language and whether it is a news item or a blog post.
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "_posts/tr/haber", type: posts }
    values: { lang: tr, kind: haber, permalink: "/haberler/:title/" }
  - scope: { path: "_posts/tr/blog", type: posts }
    values: { lang: tr, kind: blog, permalink: "/blog/:title/" }
  - scope: { path: "_posts/en/haber", type: posts }
    values: { lang: en, kind: haber, permalink: "/en/news/:title/" }
  - scope: { path: "_posts/en/blog", type: posts }
    values: { lang: en, kind: blog, permalink: "/en/blog/:title/" }
  - scope: { path: "_posts/ar/haber", type: posts }
    values: { lang: ar, kind: haber, permalink: "/ar/news/:title/" }
  - scope: { path: "_posts/ar/blog", type: posts }
    values: { lang: ar, kind: blog, permalink: "/ar/blog/:title/" }
  # One page per jurist and language, written by tools/import_fuqaha.py.
  - scope: { path: "_fakihler", type: fakihler }
    values: { layout: jurist, kind: fakih }
  - scope: { path: "_fakihler/tr", type: fakihler }
    values: { lang: tr, permalink: "/fukaha/:name/" }
  - scope: { path: "_fakihler/en", type: fakihler }
    values: { lang: en, permalink: "/en/jurists/:name/" }
  - scope: { path: "_fakihler/ar", type: fakihler }
    values: { lang: ar, permalink: "/ar/jurists/:name/" }

  # One page per part of al-Jawahir al-mudiyya and language, written by tools/import_cevahir.py.
  - scope: { path: "_cevahir", type: cevahir }
    values: { layout: tabakat, kind: cevahir, book: cevahir }
  - scope: { path: "_cevahir/tr", type: cevahir }
    values: { lang: tr, permalink: "/fukaha/cevahir/:name/" }
  - scope: { path: "_cevahir/en", type: cevahir }
    values: { lang: en, permalink: "/en/jurists/jawahir/:name/" }
  - scope: { path: "_cevahir/ar", type: cevahir }
    values: { lang: ar, permalink: "/ar/jurists/jawahir/:name/" }

  # One page per letter of al-Fawaid al-bahiyya and language, written by tools/import_fevaid.py.
  - scope: { path: "_fevaid", type: fevaid }
    values: { layout: tabakat, kind: fevaid, book: fevaid }
  - scope: { path: "_fevaid/tr", type: fevaid }
    values: { lang: tr, permalink: "/fukaha/fevaid/:name/" }
  - scope: { path: "_fevaid/en", type: fevaid }
    values: { lang: en, permalink: "/en/jurists/fawaid/:name/" }
  - scope: { path: "_fevaid/ar", type: fevaid }
    values: { lang: ar, permalink: "/ar/jurists/fawaid/:name/" }

collections:
  fakihler:
    output: true
  cevahir:
    output: true
  fevaid:
    output: true
